<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Минималистичный темный градиент для обсидиановой сферы -->
    <radialGradient id="darkOrbCore" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#32323e"/>
      <stop offset="45%" stop-color="#181820"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>
    <!-- Металлическое платиновое кольцо -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
  </defs>

  <!-- Задняя половина орбитального кольца -->
  <path d="M 12 52 A 52 18 0 0 1 108 52" fill="none" stroke="url(#metalRing)" stroke-width="2.5" transform="rotate(-20 60 60)" opacity="0.4"/>

  <!-- Основная сфера -->
  <circle cx="60" cy="60" r="38" fill="url(#darkOrbCore)" stroke="#272730" stroke-width="2"/>
  
  <!-- Тонкий внутренний фасеточный контур -->
  <circle cx="60" cy="60" r="32" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.1"/>

  <!-- Минималистичный знак тайны / руна -->
  <path d="M54 45 C54 39, 66 39, 66 46 C66 52, 60 54, 60 61" fill="none" stroke="#e4e4e7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="70" r="2.5" fill="#e4e4e7"/>

  <!-- Передняя половина орбитального кольца -->
  <path d="M 12 52 A 52 18 0 0 0 108 52" fill="none" stroke="url(#metalRing)" stroke-width="2.5" transform="rotate(-20 60 60)"/>
</svg>