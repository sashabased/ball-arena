<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- НЕОНОВЫЙ КИБЕР-БОКС -->
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="60" r="48" fill="url(#cyberGlow)"/>

  <!-- Кибернетический контейнер -->
  <rect x="20" y="24" width="80" height="72" rx="10" fill="#05101e" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="28" y="32" width="64" height="56" rx="6" fill="#081a30" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Микрочип матрица -->
  <rect x="44" y="44" width="32" height="32" rx="4" fill="#0369a1" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="52" y="52" width="16" height="16" fill="#38bdf8"/>
  <circle cx="60" cy="60" r="3" fill="#ffffff"/>

  <!-- Неоновые шины данных -->
  <line x1="28" y1="44" x2="44" y2="44" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="28" y1="60" x2="44" y2="60" stroke="#38bdf8" stroke-width="2"/>
  <line x1="28" y1="76" x2="44" y2="76" stroke="#38bdf8" stroke-width="1.5"/>

  <line x1="76" y1="44" x2="92" y2="44" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="76" y1="60" x2="92" y2="60" stroke="#38bdf8" stroke-width="2"/>
  <line x1="76" y1="76" x2="92" y2="76" stroke="#38bdf8" stroke-width="1.5"/>
</svg>
