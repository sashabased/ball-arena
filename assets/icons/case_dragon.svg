<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- СОКРОВИЩНИЦА ДРАКОНА (Dragon Flame Vault) -->
  <defs>
    <radialGradient id="dragonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#b91c1c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="62" r="50" fill="url(#dragonGlow)"/>

  <!-- Сундук с чешуйчатым рельефом -->
  <polygon points="32,20 88,20 108,46 108,92 84,106 36,106 12,92 12,46" fill="#180505" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="38,26 82,26 98,48 98,86 78,98 42,98 22,86 22,48" fill="#2a0808" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Глаз дракона / огненный кристалл -->
  <polygon points="60,34 84,62 60,90 36,62" fill="#7f1d1d" stroke="#fbbf24" stroke-width="2"/>
  <ellipse cx="60" cy="62" rx="14" ry="18" fill="#ea580c"/>
  <ellipse cx="60" cy="62" rx="4" ry="14" fill="#180505"/>
  <circle cx="58" cy="58" r="2.5" fill="#fef08a"/>

  <!-- Языки пламени по бокам -->
  <path d="M22,48 Q40,55 36,62" stroke="#fbbf24" stroke-width="1.8" fill="none"/>
  <path d="M98,48 Q80,55 84,62" stroke="#fbbf24" stroke-width="1.8" fill="none"/>
</svg>
