<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Градиент сингулярности Бездны -->
    <radialGradient id="voidOrbCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b1d54"/>
      <stop offset="50%" stop-color="#180d24"/>
      <stop offset="100%" stop-color="#07030a"/>
    </radialGradient>
    <linearGradient id="voidGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Задняя часть двойного кольца затмения -->
  <ellipse cx="60" cy="60" rx="55" ry="17" fill="none" stroke="url(#voidGoldRing)" stroke-width="2" transform="rotate(-30 60 60)" opacity="0.4"/>
  <ellipse cx="60" cy="60" rx="50" ry="14" fill="none" stroke="#c084fc" stroke-width="1.2" transform="rotate(40 60 60)" opacity="0.35"/>

  <!-- Основная обсидиановая сфера Бездны -->
  <circle cx="60" cy="60" r="38" fill="url(#voidOrbCore)" stroke="#4a1d6d" stroke-width="2"/>

  <!-- Геометрические фасетки бездны -->
  <polygon points="60,28 78,42 78,78 60,92 42,78 42,42" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="28" x2="60" y2="92" stroke="#c084fc" stroke-width="0.8" opacity="0.3"/>
  <line x1="42" y1="60" x2="78" y2="60" stroke="#c084fc" stroke-width="0.8" opacity="0.3"/>

  <!-- Центральное кристаллическое сингулярное ядро -->
  <polygon points="60,46 70,60 60,74 50,60" fill="#1e0b2e" stroke="#fbbf24" stroke-width="1.6"/>
  <circle cx="60" cy="60" r="4" fill="#fbbf24"/>
  <circle cx="60" cy="60" r="1.5" fill="#ffffff"/>

  <!-- Передняя часть золотого кольца затмения -->
  <path d="M 5 60 A 55 17 0 0 0 115 60" fill="none" stroke="url(#voidGoldRing)" stroke-width="2.4" transform="rotate(-30 60 60)"/>
</svg>