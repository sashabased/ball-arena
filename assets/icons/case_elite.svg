<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- 3. ЭЛИТНЫЙ КЕЙС: Скошенный титановый хай-тек контейнер -->
  <!-- Скошенный силуэт -->
  <polygon points="26,30 94,30 108,50 108,96 12,96 12,50" fill="#181820" stroke="#4a4b5c" stroke-width="2"/>
  
  <!-- Верхняя панель замка -->
  <polygon points="32,32 88,32 98,48 22,48" fill="#262734" stroke="#5a5c70" stroke-width="1.5"/>
  
  <!-- Внутренние геометрические фаски -->
  <line x1="26" y1="30" x2="12" y2="50" stroke="#5a5c70" stroke-width="2"/>
  <line x1="94" y1="30" x2="108" y2="50" stroke="#5a5c70" stroke-width="2"/>
  <line x1="12" y1="50" x2="108" y2="50" stroke="#363748" stroke-width="2"/>
  
  <!-- Центральный сканер безопасности -->
  <circle cx="60" cy="70" r="16" fill="#111116" stroke="#c084fc" stroke-width="2"/>
  <circle cx="60" cy="70" r="8" fill="#251636"/>
  <circle cx="60" cy="70" r="3" fill="#c084fc"/>
</svg>
