<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- 6. ЯЩИК БОГОВ: Обсидиановый монолит с гравированными космическими рунами -->
  <!-- Октагональный обсидиановый саркофаг -->
  <polygon points="36,18 84,18 108,42 108,90 84,106 36,106 12,90 12,42" fill="#0d0d12" stroke="#ef4444" stroke-width="2.5"/>
  
  <!-- Внутренняя грань -->
  <polygon points="40,24 80,24 100,44 100,84 80,98 40,98 20,84 20,44" fill="#140a0f" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- Светящееся мифическое ядро в форме ромба -->
  <polygon points="60,34 82,62 60,90 38,62" fill="#2d060f" stroke="#f87171" stroke-width="2"/>
  <circle cx="60" cy="62" r="10" fill="#ef4444"/>
  <circle cx="60" cy="62" r="4" fill="#ffffff"/>

  <!-- Энергетические рунические насечки -->
  <line x1="20" y1="44" x2="38" y2="62" stroke="#f87171" stroke-width="1.5"/>
  <line x1="100" y1="44" x2="82" y2="62" stroke="#f87171" stroke-width="1.5"/>
  <line x1="20" y1="84" x2="38" y2="62" stroke="#f87171" stroke-width="1.5"/>
  <line x1="100" y1="84" x2="82" y2="62" stroke="#f87171" stroke-width="1.5"/>
</svg>
