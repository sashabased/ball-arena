<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gemTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gemFacet1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gemFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Центральный большой кристалл с четкими гранями -->
  <g>
    <polygon points="60,20 84,40 36,40" fill="url(#gemTop)" stroke="#0c4a6e" stroke-width="1"/>
    <polygon points="36,40 60,20 46,20" fill="#e0f2fe"/>
    <polygon points="84,40 60,20 74,20" fill="#7dd3fc"/>
    <polygon points="36,40 60,94 48,40" fill="url(#gemFacet1)" stroke="#0c4a6e" stroke-width="1"/>
    <polygon points="84,40 60,94 72,40" fill="url(#gemFacet2)" stroke="#0c4a6e" stroke-width="1"/>
    <polygon points="48,40 60,94 72,40" fill="#0ea5e9" stroke="#0c4a6e" stroke-width="1"/>
  </g>

  <!-- Маленький кристалл слева -->
  <g transform="translate(14, 46) scale(0.55)">
    <polygon points="60,20 84,40 36,40" fill="url(#gemTop)" stroke="#0c4a6e" stroke-width="1.2"/>
    <polygon points="36,40 60,94 48,40" fill="url(#gemFacet1)" stroke="#0c4a6e" stroke-width="1.2"/>
    <polygon points="84,40 60,94 72,40" fill="url(#gemFacet2)" stroke="#0c4a6e" stroke-width="1.2"/>
    <polygon points="48,40 60,94 72,40" fill="#0ea5e9" stroke="#0c4a6e" stroke-width="1.2"/>
  </g>

  <!-- Маленький кристалл справа -->
  <g transform="translate(56, 48) scale(0.6) rotate(15 60 60)">
    <polygon points="60,20 84,40 36,40" fill="url(#gemTop)" stroke="#0c4a6e" stroke-width="1.2"/>
    <polygon points="36,40 60,94 48,40" fill="url(#gemFacet1)" stroke="#0c4a6e" stroke-width="1.2"/>
    <polygon points="84,40 60,94 72,40" fill="url(#gemFacet2)" stroke="#0c4a6e" stroke-width="1.2"/>
    <polygon points="48,40 60,94 72,40" fill="#0ea5e9" stroke="#0c4a6e" stroke-width="1.2"/>
  </g>
</svg>