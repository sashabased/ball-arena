<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="50%" stop-color="#212126"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5a64"/>
      <stop offset="100%" stop-color="#28282e"/>
    </linearGradient>
    <linearGradient id="neonStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glowIron" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Корпус кейса -->
  <rect x="15" y="44" width="90" height="56" rx="8" fill="url(#ironGrad)" stroke="#4a4a55" stroke-width="2"/>
  
  <!-- Крышка кейса -->
  <path d="M12 44 L22 22 L98 22 L108 44 Z" fill="url(#metalPlate)" stroke="#5a5a66" stroke-width="2"/>
  <rect x="36" y="15" width="48" height="10" rx="3" fill="#222226" stroke="#4a4a55" stroke-width="1.5"/>

  <!-- Неоновая энергетическая полоса -->
  <rect x="18" y="42" width="84" height="4" rx="2" fill="url(#neonStripe)" filter="url(#glowIron)"/>

  <!-- Металлические заклепки и усиления по углам -->
  <circle cx="24" cy="54" r="2.5" fill="#8e8e98"/>
  <circle cx="96" cy="54" r="2.5" fill="#8e8e98"/>
  <circle cx="24" cy="88" r="2.5" fill="#8e8e98"/>
  <circle cx="96" cy="88" r="2.5" fill="#8e8e98"/>

  <!-- Центральный электронный замок -->
  <rect x="48" y="38" width="24" height="22" rx="4" fill="#111114" stroke="#4a4a55" stroke-width="2"/>
  <circle cx="60" cy="49" r="4" fill="#00d2ff" filter="url(#glowIron)"/>
</svg>
