  <rect x="12" y="32" width="96" height="14" rx="3" fill="#2a2b32" stroke="#484954" stroke-width="2"/>
  
  <!-- Вертикальные стальные планки -->
  <rect x="34" y="42" width="10" height="58" fill="#24252c" stroke="#383942" stroke-width="1.5"/>
  <rect x="76" y="42" width="10" height="58" fill="#24252c" stroke="#383942" stroke-width="1.5"/>
  
  <!-- Ручка крышки -->
