<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- 4. ТРОФЕЙНЫЙ КЕЙС: Усиленный экспедиционный дроп-бокс -->
  <rect x="18" y="38" width="84" height="64" rx="4" fill="#1b241e" stroke="#2d4032" stroke-width="2"/>
  <rect x="14" y="28" width="92" height="14" rx="3" fill="#243328" stroke="#3d5644" stroke-width="2"/>
  
  <!-- Защитные диагональные стропы крест-накрест -->
  <line x1="20" y1="40" x2="100" y2="100" stroke="#131a15" stroke-width="6"/>
  <line x1="100" y1="40" x2="20" y2="100" stroke="#131a15" stroke-width="6"/>
  <line x1="20" y1="40" x2="100" y2="100" stroke="#4ade80" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="40" x2="20" y2="100" stroke="#4ade80" stroke-width="1.5" opacity="0.6"/>

  <!-- Центральная застежка с символом парашюта / капли -->
  <rect x="50" y="36" width="20" height="22" rx="3" fill="#111612" stroke="#4ade80" stroke-width="1.5"/>
  <circle cx="60" cy="47" r="4" fill="#4ade80"/>
</svg>
